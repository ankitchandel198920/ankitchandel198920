name: Generate Cosmic Contribution Snake

on:
  # Runs daily at 00:00 UTC to keep the contribution constellation fresh
  schedule:
    - cron: "0 0 * * *"

  # Allows manual execution from the GitHub Actions tab
  workflow_dispatch:

  # Updates when profile repository content changes on main
  push:
    branches:
      - main

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate cosmic contribution snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/contribution-snake.svg?color_snake=#22D3EE&color_dots=#0F172A,#0078D4,#38BDF8,#A855F7,#FF9900

      - name: Commit updated snake asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-snake.svg
          if ! git diff --staged --quiet; then
            git commit -m "chore: update cosmic contribution snake [skip ci]"
            git push
          fi

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-label="Building the Future, One Pipeline at a Time — Ankit Chandel">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#030612" />
      <stop offset="65%" stop-color="#070E24" />
      <stop offset="100%" stop-color="#0B1433" />
    </linearGradient>
    <linearGradient id="horizonStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0078D4" />
      <stop offset="35%" stop-color="#22D3EE" />
      <stop offset="65%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#FF9900" />
    </linearGradient>
    <radialGradient id="planetAtmosphere" cx="50%" cy="135%" r="85%">
      <stop offset="0%" stop-color="#0078D4" stop-opacity="0.40" />
      <stop offset="45%" stop-color="#6366F1" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#030612" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="quoteGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="42%" stop-color="#38BDF8" />
      <stop offset="72%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <filter id="footerGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <path id="orbitArc" d="M 80 185 Q 600 95 1120 185" />
  </defs>

  <rect width="1200" height="220" rx="18" fill="url(#footerBg)" />
  <rect width="1200" height="220" rx="18" fill="url(#planetAtmosphere)" />
  <rect x="1.5" y="1.5" width="1197" height="217" rx="17" fill="none" stroke="url(#horizonStroke)" stroke-opacity="0.45" stroke-width="1.5" />

  <!-- Starfield -->
  <circle cx="95" cy="42" r="1.3" fill="#F8FAFC"><animate attributeName="opacity" values="0.2;0.95;0.2" dur="3.4s" repeatCount="indefinite" /></circle>
  <circle cx="185" cy="76" r="1" fill="#38BDF8"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="4.2s" repeatCount="indefinite" /></circle>
  <circle cx="310" cy="34" r="1.4" fill="#A855F7"><animate attributeName="opacity" values="0.25;0.9;0.25" dur="3.8s" repeatCount="indefinite" /></circle>
  <circle cx="448" cy="58" r="1" fill="#F8FAFC"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="5.1s" repeatCount="indefinite" /></circle>
  <circle cx="765" cy="44" r="1.3" fill="#22D3EE"><animate attributeName="opacity" values="0.2;0.95;0.2" dur="3.5s" repeatCount="indefinite" /></circle>
  <circle cx="892" cy="72" r="1.1" fill="#FF9900"><animate attributeName="opacity" values="0.85;0.2;0.85" dur="4.5s" repeatCount="indefinite" /></circle>
  <circle cx="1015" cy="38" r="1.5" fill="#F8FAFC"><animate attributeName="opacity" values="0.25;0.95;0.25" dur="3.1s" repeatCount="indefinite" /></circle>
  <circle cx="1110" cy="68" r="1.2" fill="#38BDF8"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="4.0s" repeatCount="indefinite" /></circle>

  <!-- Subtle Constellation Lines -->
  <g stroke="#1E293B" stroke-width="0.9" opacity="0.7">
    <line x1="95" y1="42" x2="185" y2="76" />
    <line x1="185" y1="76" x2="310" y2="34" />
    <line x1="892" y1="72" x2="1015" y2="38" />
    <line x1="1015" y1="38" x2="1110" y2="68" />
  </g>

  <!-- Planetary Limb / Cosmic Horizon -->
  <path d="M 40 210 Q 600 112 1160 210" fill="#040814" fill-opacity="0.75" stroke="url(#horizonStroke)" stroke-width="2.2" filter="url(#footerGlow)" />
  <path d="M 80 185 Q 600 95 1120 185" fill="none" stroke="#38BDF8" stroke-width="0.8" stroke-dasharray="5 9" opacity="0.4" />

  <!-- Orbiting Satellite Node along Horizon -->
  <circle r="4.5" fill="#22D3EE" filter="url(#footerGlow)">
    <animateMotion dur="14s" repeatCount="indefinite">
      <mpath href="#orbitArc" />
    </animateMotion>
  </circle>
  <circle r="3.2" fill="#FF9900" filter="url(#footerGlow)">
    <animateMotion dur="14s" begin="-7s" repeatCount="indefinite">
      <mpath href="#orbitArc" />
    </animateMotion>
  </circle>

  <!-- Closing Signature Quote -->
  <text x="600" y="92" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="url(#quoteGrad)" letter-spacing="-0.2">
    "Building the Future, One Pipeline at a Time."
  </text>

  <text x="600" y="130" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#94A3B8" letter-spacing="1.6">
    ANKIT CHANDEL  ·  SENIOR DEVOPS ENGINEER  ·  CLOUD &amp; AI INFRASTRUCTURE
  </text>

  <!-- Subtle Bottom Telemetry Beacon -->
  <g transform="translate(522, 174)">
    <circle cx="0" cy="0" r="3.5" fill="#10B981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <text x="12" y="4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#CBD5E1" letter-spacing="1.1">TRANSMISSION ACTIVE</text>
  </g>
</svg>

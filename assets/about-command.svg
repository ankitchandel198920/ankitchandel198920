<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" width="460" height="320" role="img" aria-label="Ankit Chandel Engineering Identity Telemetry">
  <defs>
    <linearGradient id="aboutBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050917" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>
    <linearGradient id="aboutBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FF9900" stop-opacity="0.8" />
    </linearGradient>
    <filter id="aboutGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="456" height="316" rx="16" fill="url(#aboutBg)" stroke="url(#aboutBorder)" stroke-width="1.5" />

  <!-- Top Terminal Header -->
  <rect x="2" y="2" width="456" height="36" rx="16" fill="#0B142C" />
  <rect x="2" y="22" width="456" height="16" fill="#0B142C" />
  <circle cx="22" cy="20" r="4.5" fill="#FF5F56" opacity="0.85" />
  <circle cx="38" cy="20" r="4.5" fill="#FFBD2E" opacity="0.85" />
  <circle cx="54" cy="20" r="4.5" fill="#27C93F" opacity="0.85" />
  <text x="74" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#94A3B8">engineer-profile.yaml</text>

  <!-- YAML Content -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">
    <text x="22" y="66" fill="#64748B">01</text><text x="48" y="66" fill="#38BDF8">name:</text><text x="116" y="66" fill="#F8FAFC">"Ankit Chandel"</text>
    <text x="22" y="92" fill="#64748B">02</text><text x="48" y="92" fill="#38BDF8">title:</text><text x="116" y="92" fill="#22D3EE">"Senior DevOps Engineer"</text>
    <text x="22" y="118" fill="#64748B">03</text><text x="48" y="118" fill="#38BDF8">clouds:</text><text x="116" y="118" fill="#FBBF24">["AWS", "Microsoft Azure"]</text>
    <text x="22" y="144" fill="#64748B">04</text><text x="48" y="144" fill="#38BDF8">certs:</text>
    <text x="22" y="168" fill="#64748B">05</text><text x="64" y="168" fill="#FF9900">- "AWS Solutions Architect (SAA)"</text>
    <text x="22" y="192" fill="#64748B">06</text><text x="64" y="192" fill="#38BDF8">- "Azure AI Foundation"</text>
    <text x="22" y="218" fill="#64748B">07</text><text x="48" y="218" fill="#38BDF8">focus:</text>
    <text x="22" y="242" fill="#64748B">08</text><text x="64" y="242" fill="#D8B4FE">["Cloud Architecture", "IaC",</text>
    <text x="22" y="264" fill="#64748B">09</text><text x="72" y="264" fill="#D8B4FE">"CI/CD", "Scale", "AI Ops"]</text>
  </g>

  <!-- Live Pulse Line -->
  <g transform="translate(22, 294)">
    <circle cx="6" cy="-4" r="4" fill="#10B981" filter="url(#aboutGlow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="18" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#10B981">READY FOR INTELLIGENT CLOUD SCALE</text>
  </g>
</svg>

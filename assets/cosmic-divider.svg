<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 32" width="1200" height="32" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="divLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#030612" stop-opacity="0" />
      <stop offset="20%" stop-color="#0078D4" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.85" />
      <stop offset="80%" stop-color="#FF9900" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#030612" stop-opacity="0" />
    </linearGradient>
    <filter id="pulseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <line x1="24" y1="16" x2="1176" y2="16" stroke="url(#divLine)" stroke-width="1.5" />

  <!-- Traveling Energy Signal -->
  <circle cx="100" cy="16" r="2.8" fill="#22D3EE" filter="url(#pulseGlow)">
    <animate attributeName="cx" values="60;1140;60" dur="8s" repeatCount="indefinite" />
    <animate attributeName="fill" values="#22D3EE;#A855F7;#FF9900;#22D3EE" dur="8s" repeatCount="indefinite" />
  </circle>

  <!-- Center Star Emblem -->
  <g transform="translate(600, 16)">
    <polygon points="0,-7 6,0 0,7 -6,0" fill="#070D21" stroke="#38BDF8" stroke-width="1.4" />
    <circle cx="0" cy="0" r="2.2" fill="#FF9900">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.5s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>

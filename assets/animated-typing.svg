<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 84" width="1200" height="84" role="img" aria-label="Animated terminal typing: Engineering the Cloud, Automating Everything, AWS and Azure Ecosystems, Building Intelligent Infrastructure">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050917" />
      <stop offset="50%" stop-color="#0A1128" />
      <stop offset="100%" stop-color="#050917" />
    </linearGradient>
    <linearGradient id="termBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0078D4" stop-opacity="0.75" />
      <stop offset="33%" stop-color="#22D3EE" stop-opacity="0.85" />
      <stop offset="66%" stop-color="#A855F7" stop-opacity="0.80" />
      <stop offset="100%" stop-color="#FF9900" stop-opacity="0.75" />
    </linearGradient>
    <filter id="cursorGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Clip paths for progressive typing reveal -->
    <clipPath id="clip1">
      <rect x="292" y="20" width="260" height="44">
        <animate attributeName="width" values="0;255;255;0;0" keyTimes="0;0.09;0.23;0.25;1" dur="16s" repeatCount="indefinite" />
      </rect>
    </clipPath>
    <clipPath id="clip2">
      <rect x="292" y="20" width="260" height="44">
        <animate attributeName="width" values="0;0;255;255;0;0" keyTimes="0;0.25;0.34;0.48;0.50;1" dur="16s" repeatCount="indefinite" />
      </rect>
    </clipPath>
    <clipPath id="clip3">
      <rect x="292" y="20" width="275" height="44">
        <animate attributeName="width" values="0;0;270;270;0;0" keyTimes="0;0.50;0.59;0.73;0.75;1" dur="16s" repeatCount="indefinite" />
      </rect>
    </clipPath>
    <clipPath id="clip4">
      <rect x="292" y="20" width="430" height="44">
        <animate attributeName="width" values="0;0;420;420;0" keyTimes="0;0.75;0.85;0.98;1" dur="16s" repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <!-- Holographic Terminal Bar -->
  <rect x="2" y="4" width="1196" height="76" rx="14" fill="url(#termBg)" stroke="url(#termBorder)" stroke-width="1.5" />

  <!-- Terminal Window Dots -->
  <circle cx="30" cy="42" r="5" fill="#FF5F56" opacity="0.85" />
  <circle cx="48" cy="42" r="5" fill="#FFBD2E" opacity="0.85" />
  <circle cx="66" cy="42" r="5" fill="#27C93F" opacity="0.85" />

  <!-- Prompt Prefix -->
  <text x="90" y="47" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15.5" font-weight="700" fill="#38BDF8">ankit@cloud-hub</text>
  <text x="234" y="47" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15.5" fill="#A855F7">:~$</text>

  <!-- Phrase 1 (Default visible for static fallback; animated in SMIL browsers) -->
  <g opacity="1">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.245;0.25;1" dur="16s" repeatCount="indefinite" />
    <text x="294" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18.5" font-weight="600" fill="#F8FAFC" clip-path="url(#clip1)">Engineering the Cloud</text>
    <rect x="528" y="30" width="10" height="22" rx="1.5" fill="#22D3EE" filter="url(#cursorGlow)">
      <animate attributeName="x" values="294;528;528;294;294" keyTimes="0;0.09;0.23;0.25;1" dur="16s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0.15;1" dur="0.75s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Phrase 2 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.249;0.25;0.495;0.50;1" dur="16s" repeatCount="indefinite" />
    <text x="294" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18.5" font-weight="600" fill="#38BDF8" clip-path="url(#clip2)">Automating Everything</text>
    <rect x="294" y="30" width="10" height="22" rx="1.5" fill="#38BDF8" filter="url(#cursorGlow)">
      <animate attributeName="x" values="294;294;528;528;294;294" keyTimes="0;0.25;0.34;0.48;0.50;1" dur="16s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0.15;1" dur="0.75s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Phrase 3 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.499;0.50;0.745;0.75;1" dur="16s" repeatCount="indefinite" />
    <text x="294" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18.5" font-weight="600" fill="#FBBF24" clip-path="url(#clip3)">AWS &amp; Azure Ecosystems</text>
    <rect x="294" y="30" width="10" height="22" rx="1.5" fill="#FF9900" filter="url(#cursorGlow)">
      <animate attributeName="x" values="294;294;540;540;294;294" keyTimes="0;0.50;0.59;0.73;0.75;1" dur="16s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0.15;1" dur="0.75s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Phrase 4 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.749;0.75;0.99;1" dur="16s" repeatCount="indefinite" />
    <text x="294" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18.5" font-weight="600" fill="#D8B4FE" clip-path="url(#clip4)">Building Intelligent Infrastructure</text>
    <rect x="294" y="30" width="10" height="22" rx="1.5" fill="#A855F7" filter="url(#cursorGlow)">
      <animate attributeName="x" values="294;294;684;684;294" keyTimes="0;0.75;0.85;0.98;1" dur="16s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0.15;1" dur="0.75s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Right-Side Status Pill -->
  <g transform="translate(972, 26)">
    <rect x="0" y="0" width="204" height="32" rx="16" fill="#0B132B" stroke="#1E293B" stroke-width="1" />
    <circle cx="18" cy="16" r="4" fill="#10B981">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#94A3B8" letter-spacing="0.8">SYSTEMS NOMINAL · 24/7</text>
  </g>
</svg>

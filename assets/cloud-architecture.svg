<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="Multi-Cloud DevOps Architecture: Developer to GitHub to CI/CD Pipeline to Terraform to AWS and Azure Cloud to Kubernetes to Monitoring and Observability">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030612" />
      <stop offset="50%" stop-color="#070D21" />
      <stop offset="100%" stop-color="#0A0F24" />
    </linearGradient>
    <radialGradient id="glowAzureZone" cx="76%" cy="56%" r="36%">
      <stop offset="0%" stop-color="#0078D4" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0078D4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowAwsZone" cx="24%" cy="56%" r="36%">
      <stop offset="0%" stop-color="#FF9900" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#FF9900" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="pipeCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="pipeAws" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#FF9900" />
    </linearGradient>
    <linearGradient id="pipeAzure" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#00D4FF" />
    </linearGradient>
    <linearGradient id="obsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9900" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#00D4FF" />
    </linearGradient>

    <pattern id="archGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.6" opacity="0.35" />
    </pattern>

    <filter id="nodeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Motion Paths for Animated Data Packets -->
    <path id="pathDevToGh" d="M 206 132 L 266 132" />
    <path id="pathGhToCicd" d="M 432 132 L 492 132" />
    <path id="pathCicdToTf" d="M 678 132 L 738 132" />
    <path id="pathTfToAi" d="M 944 132 L 998 132" />
    <path id="pathTfToAws" d="M 810 178 C 810 218, 314 196, 314 242" />
    <path id="pathTfToAzure" d="M 860 178 C 860 214, 886 202, 886 242" />
    <path id="pathAwsToK8s" d="M 314 448 C 314 476, 440 468, 440 492" />
    <path id="pathAzureToK8s" d="M 886 448 C 886 476, 760 468, 760 492" />
    <path id="pathK8sToObsL" d="M 440 546 L 440 578" />
    <path id="pathK8sToObsR" d="M 760 546 L 760 578" />
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="660" rx="18" fill="url(#archBg)" />
  <rect width="1200" height="660" rx="18" fill="url(#archGrid)" />
  <rect width="1200" height="660" rx="18" fill="url(#glowAwsZone)" />
  <rect width="1200" height="660" rx="18" fill="url(#glowAzureZone)" />
  <rect x="1.5" y="1.5" width="1197" height="657" rx="17" fill="none" stroke="#1E293B" stroke-width="1.5" />

  <!-- Header Telemetry Bar -->
  <text x="44" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#38BDF8" letter-spacing="1.6">END-TO-END CLOUD ARCHITECTURE // MULTI-CLOUD DEVOPS &amp; AI WORKFLOW</text>
  <g transform="translate(960, 24)">
    <rect x="0" y="0" width="196" height="26" rx="13" fill="#0B132B" stroke="#1E293B" />
    <circle cx="16" cy="13" r="4" fill="#10B981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="17" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#CBD5E1">PIPELINE TELEMETRY</text>
  </g>

  <!-- ========================================================= -->
  <!-- TOP ROW: DEV -> GITHUB -> CI/CD -> TERRAFORM -> AI/AUTO   -->
  <!-- ========================================================= -->

  <!-- Animated Connector Lines -->
  <g fill="none" stroke-width="2" stroke-dasharray="6 6">
    <use href="#pathDevToGh" stroke="#22D3EE">
      <animate attributeName="stroke-dashoffset" values="24;0" dur="1.4s" repeatCount="indefinite" />
    </use>
    <use href="#pathGhToCicd" stroke="#38BDF8">
      <animate attributeName="stroke-dashoffset" values="24;0" dur="1.4s" repeatCount="indefinite" />
    </use>
    <use href="#pathCicdToTf" stroke="#A855F7">
      <animate attributeName="stroke-dashoffset" values="24;0" dur="1.4s" repeatCount="indefinite" />
    </use>
    <use href="#pathTfToAi" stroke="#C084FC">
      <animate attributeName="stroke-dashoffset" values="24;0" dur="1.4s" repeatCount="indefinite" />
    </use>
    <!-- Branching Terraform to AWS & Azure -->
    <use href="#pathTfToAws" stroke="url(#pipeAws)" stroke-width="2.2">
      <animate attributeName="stroke-dashoffset" values="24;0" dur="1.8s" repeatCount="indefinite" />
    </use>
    <use href="#pathTfToAzure" stroke="url(#pipeAzure)" stroke-width="2.2">
      <animate attributeName="stroke-dashoffset" values="24;0" dur="1.8s" repeatCount="indefinite" />
    </use>
    <!-- Clouds to Kubernetes & Observability -->
    <use href="#pathAwsToK8s" stroke="#FF9900" stroke-width="2">
      <animate attributeName="stroke-dashoffset" values="24;0" dur="1.6s" repeatCount="indefinite" />
    </use>
    <use href="#pathAzureToK8s" stroke="#00D4FF" stroke-width="2">
      <animate attributeName="stroke-dashoffset" values="24;0" dur="1.6s" repeatCount="indefinite" />
    </use>
    <use href="#pathK8sToObsL" stroke="#FF9900" stroke-width="2">
      <animate attributeName="stroke-dashoffset" values="24;0" dur="1.4s" repeatCount="indefinite" />
    </use>
    <use href="#pathK8sToObsR" stroke="#00D4FF" stroke-width="2">
      <animate attributeName="stroke-dashoffset" values="24;0" dur="1.4s" repeatCount="indefinite" />
    </use>
  </g>

  <!-- Node 1: Developer -->
  <g transform="translate(44, 86)">
    <rect x="0" y="0" width="162" height="92" rx="14" fill="#0A1229" fill-opacity="0.92" stroke="#22D3EE" stroke-width="1.5" />
    <circle cx="24" cy="24" r="6" fill="#22D3EE" filter="url(#nodeGlow)" />
    <text x="38" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#22D3EE">01 · SOURCE</text>
    <text x="16" y="54" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">Developer</text>
    <text x="16" y="75" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#94A3B8">Code · IaC · Git Push</text>
  </g>

  <!-- Node 2: GitHub -->
  <g transform="translate(266, 86)">
    <rect x="0" y="0" width="166" height="92" rx="14" fill="#0A1229" fill-opacity="0.92" stroke="#38BDF8" stroke-width="1.5" />
    <circle cx="24" cy="24" r="6" fill="#38BDF8" filter="url(#nodeGlow)" />
    <text x="38" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#38BDF8">02 · VCS</text>
    <text x="16" y="54" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">GitHub</text>
    <text x="16" y="75" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#94A3B8">PR Reviews · Policies</text>
  </g>

  <!-- Node 3: CI/CD Pipeline -->
  <g transform="translate(492, 86)">
    <rect x="0" y="0" width="186" height="92" rx="14" fill="#0A1229" fill-opacity="0.92" stroke="#A855F7" stroke-width="1.5" />
    <circle cx="24" cy="24" r="6" fill="#A855F7" filter="url(#nodeGlow)" />
    <text x="38" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#D8B4FE">03 · AUTOMATION</text>
    <text x="16" y="54" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">CI/CD Pipeline</text>
    <text x="16" y="75" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#94A3B8">Build · Scan · Artifacts</text>
  </g>

  <!-- Node 4: Terraform -->
  <g transform="translate(738, 86)">
    <rect x="0" y="0" width="206" height="92" rx="14" fill="#0A1229" fill-opacity="0.92" stroke="#8B5CF6" stroke-width="1.8" filter="url(#nodeGlow)" />
    <circle cx="24" cy="24" r="6" fill="#8B5CF6">
      <animate attributeName="r" values="5;7.5;5" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <text x="38" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#C4B5FD">04 · IAC ENGINE</text>
    <text x="16" y="54" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">Terraform</text>
    <text x="16" y="75" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#94A3B8">Plan · Apply · Multi-Cloud</text>
  </g>

  <!-- Node 5: AI & Automation -->
  <g transform="translate(998, 86)">
    <rect x="0" y="0" width="158" height="92" rx="14" fill="#0A1229" fill-opacity="0.92" stroke="#C084FC" stroke-width="1.4" />
    <circle cx="24" cy="24" r="6" fill="#C084FC" filter="url(#nodeGlow)" />
    <text x="38" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#E9D5FF">AI OPS</text>
    <text x="16" y="54" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15.5" font-weight="700" fill="#F8FAFC">AI &amp; Scripting</text>
    <text x="16" y="75" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#94A3B8">Python · Bash · Azure AI</text>
  </g>

  <!-- ========================================================= -->
  <!-- MIDDLE ROW: SEPARATE AWS & AZURE CLOUD ECOSYSTEMS         -->
  <!-- ========================================================= -->

  <!-- Left Ecosystem: Amazon Web Services -->
  <g transform="translate(44, 242)">
    <rect x="0" y="0" width="536" height="206" rx="16" fill="#0A1022" fill-opacity="0.92" stroke="#FF9900" stroke-width="1.6" />
    <rect x="16" y="14" width="236" height="24" rx="12" fill="#1F1507" stroke="#FF9900" stroke-opacity="0.65" />
    <circle cx="30" cy="26" r="4" fill="#FF9900" filter="url(#nodeGlow)" />
    <text x="42" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#FBBF24" letter-spacing="0.8">AWS CLOUD ECOSYSTEM</text>

    <!-- AWS Sub-Components Grid -->
    <g transform="translate(16, 52)">
      <!-- Box 1: Networking & IAM -->
      <rect x="0" y="0" width="244" height="64" rx="10" fill="#0F172A" stroke="#334155" />
      <text x="14" y="24" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#FDE68A">VPC · Route 53 · IAM</text>
      <text x="14" y="46" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#94A3B8">Network Isolation, DNS &amp; Access</text>

      <!-- Box 2: Compute & Containers -->
      <rect x="260" y="0" width="244" height="64" rx="10" fill="#0F172A" stroke="#FF9900" stroke-opacity="0.65" />
      <text x="274" y="24" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#FF9900">EKS · ECS · EC2 · ECR</text>
      <text x="274" y="46" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#94A3B8">Kubernetes, Containers &amp; Compute</text>

      <!-- Box 3: Serverless & Data -->
      <rect x="0" y="76" width="244" height="64" rx="10" fill="#0F172A" stroke="#334155" />
      <text x="14" y="100" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#FDE68A">S3 · RDS · Lambda</text>
      <text x="14" y="122" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#94A3B8">Object Storage, Relational &amp; Events</text>

      <!-- Box 4: Governance & Ops -->
      <rect x="260" y="76" width="244" height="64" rx="10" fill="#0F172A" stroke="#334155" />
      <text x="274" y="100" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#FDE68A">CloudFormation · SSM · CW</text>
      <text x="274" y="122" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#94A3B8">Stacks, Fleet Ops &amp; CloudWatch</text>
    </g>
  </g>

  <!-- Right Ecosystem: Microsoft Azure -->
  <g transform="translate(620, 242)">
    <rect x="0" y="0" width="536" height="206" rx="16" fill="#081228" fill-opacity="0.92" stroke="#00D4FF" stroke-width="1.6" />
    <rect x="16" y="14" width="256" height="24" rx="12" fill="#061E3A" stroke="#0078D4" stroke-opacity="0.85" />
    <circle cx="30" cy="26" r="4" fill="#00D4FF" filter="url(#nodeGlow)" />
    <text x="42" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="0.8">MICROSOFT AZURE ECOSYSTEM</text>

    <!-- Azure Sub-Components Grid -->
    <g transform="translate(16, 52)">
      <!-- Box 1: Networking & Ingress -->
      <rect x="0" y="0" width="244" height="64" rx="10" fill="#0F172A" stroke="#334155" />
      <text x="14" y="24" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#BAE6FD">VNet · Load Balancer · App GW</text>
      <text x="14" y="46" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#94A3B8">Hub-Spoke Routing &amp; WAF Ingress</text>

      <!-- Box 2: Kubernetes & Compute -->
      <rect x="260" y="0" width="244" height="64" rx="10" fill="#0F172A" stroke="#00D4FF" stroke-opacity="0.65" />
      <text x="274" y="24" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#38BDF8">AKS · ACR · VMs · App Service</text>
      <text x="274" y="46" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#94A3B8">Managed K8s, Registry &amp; Compute</text>

      <!-- Box 3: Identity & Security -->
      <rect x="0" y="76" width="244" height="64" rx="10" fill="#0F172A" stroke="#334155" />
      <text x="14" y="100" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#BAE6FD">Entra ID · Key Vault · DevOps</text>
      <text x="14" y="122" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#94A3B8">Zero-Trust IAM, Secrets &amp; Pipelines</text>

      <!-- Box 4: Data, Serverless & AI -->
      <rect x="260" y="76" width="244" height="64" rx="10" fill="#0F172A" stroke="#A855F7" stroke-opacity="0.55" />
      <text x="274" y="100" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#D8B4FE">Storage · SQL · Functions · Azure AI</text>
      <text x="274" y="122" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#94A3B8">Data, Serverless &amp; AI Services</text>
    </g>
  </g>

  <!-- ========================================================= -->
  <!-- LAYER 3: KUBERNETES ORCHESTRATION BRIDGE                  -->
  <!-- ========================================================= -->
  <g transform="translate(230, 492)">
    <rect x="0" y="0" width="740" height="54" rx="14" fill="#0B132B" fill-opacity="0.95" stroke="#38BDF8" stroke-width="1.5" />
    <circle cx="24" cy="27" r="6" fill="#326CE5" stroke="#38BDF8" stroke-width="1.5" />
    <text x="42" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="0.9">05 · KUBERNETES &amp; GITOPS ORCHESTRATION</text>
    <text x="42" y="42" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#CBD5E1">
      Amazon EKS &amp; Azure AKS  ·  Docker  ·  Helm Charts  ·  ArgoCD Continuous Reconciliation
    </text>
  </g>

  <!-- ========================================================= -->
  <!-- LAYER 4: MONITORING & OBSERVABILITY                       -->
  <!-- ========================================================= -->
  <g transform="translate(44, 578)">
    <rect x="0" y="0" width="1112" height="58" rx="14" fill="#080F24" fill-opacity="0.96" stroke="url(#obsGrad)" stroke-width="1.6" />
    <circle cx="26" cy="29" r="5.5" fill="#10B981" filter="url(#nodeGlow)">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="44" y="25" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#10B981" letter-spacing="1">06 · MONITORING &amp; OBSERVABILITY</text>
    <text x="44" y="44" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#E2E8F0">
      AWS CloudWatch  ·  Azure Monitor  ·  Application Insights  ·  Centralized Logs, Telemetry &amp; Automated Alerting
    </text>
    <text x="1084" y="34" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#94A3B8">HEALTHY</text>
  </g>

  <!-- Animated Glowing Data Packets -->
  <circle r="4" fill="#22D3EE" filter="url(#nodeGlow)">
    <animateMotion dur="1.6s" repeatCount="indefinite"><mpath href="#pathDevToGh" /></animateMotion>
  </circle>
  <circle r="4" fill="#38BDF8" filter="url(#nodeGlow)">
    <animateMotion dur="1.6s" begin="0.3s" repeatCount="indefinite"><mpath href="#pathGhToCicd" /></animateMotion>
  </circle>
  <circle r="4" fill="#A855F7" filter="url(#nodeGlow)">
    <animateMotion dur="1.6s" begin="0.6s" repeatCount="indefinite"><mpath href="#pathCicdToTf" /></animateMotion>
  </circle>
  <circle r="3.5" fill="#E9D5FF" filter="url(#nodeGlow)">
    <animateMotion dur="1.6s" begin="0.9s" repeatCount="indefinite"><mpath href="#pathTfToAi" /></animateMotion>
  </circle>
  <circle r="4.2" fill="#FF9900" filter="url(#nodeGlow)">
    <animateMotion dur="2.8s" repeatCount="indefinite"><mpath href="#pathTfToAws" /></animateMotion>
  </circle>
  <circle r="4.2" fill="#00D4FF" filter="url(#nodeGlow)">
    <animateMotion dur="2.8s" begin="0.7s" repeatCount="indefinite"><mpath href="#pathTfToAzure" /></animateMotion>
  </circle>
  <circle r="3.8" fill="#FF9900" filter="url(#nodeGlow)">
    <animateMotion dur="2s" repeatCount="indefinite"><mpath href="#pathAwsToK8s" /></animateMotion>
  </circle>
  <circle r="3.8" fill="#00D4FF" filter="url(#nodeGlow)">
    <animateMotion dur="2s" begin="0.5s" repeatCount="indefinite"><mpath href="#pathAzureToK8s" /></animateMotion>
  </circle>
  <circle r="3.5" fill="#10B981" filter="url(#nodeGlow)">
    <animateMotion dur="1.5s" repeatCount="indefinite"><mpath href="#pathK8sToObsL" /></animateMotion>
  </circle>
  <circle r="3.5" fill="#10B981" filter="url(#nodeGlow)">
    <animateMotion dur="1.5s" begin="0.4s" repeatCount="indefinite"><mpath href="#pathK8sToObsR" /></animateMotion>
  </circle>
</svg>
